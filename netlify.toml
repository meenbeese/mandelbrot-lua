# Netlify build config for the wasm web build (via love.js + bun)
[build]
  publish = "dist"
  command = """
    python3 -m pip install --quiet numpy 2>/dev/null || pip3 install --quiet numpy || true
    curl -fsSL https://bun.sh/install | bash
    export PATH="$HOME/.bun/bin:$PATH"
    mkdir -p .webstage
    cp main.lua shader.glsl .webstage/
    bunx love.js .webstage build/web -c -t "Mandelbrot"
    rm -rf .webstage
    SITE=$(dirname "$(find build/web -name 'love.wasm' -print -quit)")
    mkdir -p dist
    cp -r "$SITE"/. dist/
  """
